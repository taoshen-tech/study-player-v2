name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve SPM packages (KSPlayer + FFmpegKit)
        run: xcodebuild -resolvePackageDependencies -project StudyPlayer.xcodeproj -scheme StudyPlayer

      - name: Build (unsigned, device arm64)
        run: |
          xcodebuild -project StudyPlayer.xcodeproj \
            -scheme StudyPlayer \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/StudyPlayer.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean archive

      - name: Package unsigned IPA
        run: |
          APP_DIR="$RUNNER_TEMP/StudyPlayer.xcarchive/Products/Applications/StudyPlayer.app"
          test -d "$APP_DIR" || { echo "StudyPlayer.app not found"; ls "$RUNNER_TEMP/StudyPlayer.xcarchive/Products/Applications/"; exit 1; }
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_DIR" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry StudyPlayer-unsigned.ipa Payload
          ls -lh StudyPlayer-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: StudyPlayer-unsigned-IPA
          path: ${{ runner.temp }}/StudyPlayer-unsigned.ipa
          retention-days: 90
